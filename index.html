const setup=()=>{b.innerHTML=`<div class="seg" style="margin:0 0 16px"><button class="on">Play vs Bot</button><button disabled style="opacity:.55">Play Online · Soon</button></div><div class="g" style="text-align:left"><label>Bot level<select id="lv">${LV.map((l,i)=>`<option value="${i}" ${i==lv?'selected':''}>${l}</option>`).join('')}</select></label><label>Your color<select id="pc"><option value="w">White</option><option value="b" ${pc=='b'?'selected':''}>Black</option><option value="r">Random</option></select></label><button class="btn" id="go">Start game</button></div>`;$('#go',b).onclick=()=>{lv=+$('#lv',b).value;pc=$('#pc',b).value;me=pc=='r'?'wb'[R(2)]:pc;g=new Chess();sel=null;over='';hn=null;draw();turn()}};
const draw=()=>{const T=sel?g.moves({square:sel,verbose:true}).map(m=>m.to):[];let cs=[];g.board().forEach((r,y)=>r.forEach((p,x)=>cs.push([x,y,p])));if(me=='b')cs.reverse();
b.innerHTML=`<div class="cb">${cs.map(([x,y,p])=>{const s='abcdefgh'[x]+(8-y);return`<button data-s="${s}" aria-label="${s}" class="${(x+y)%2?'d':'l'}${s==sel?' sl':''}${T.includes(s)?' tg':''}${hn&&(s==hn.from||s==hn.to)?' hn':''}" style="${p&&p.color=='w'?'color:#fff;text-shadow:0 0 3px #000,0 0 3px #000':''}">${p?U[p.type]+'\uFE0E':''}</button>`}).join('')}</div><p class="mu" style="margin:12px 0">${st()}</p><div class="row" style="justify-content:center"><button class="btn s o" id="hi">Hint</button><button class="btn s o" id="un">Undo</button><button class="btn s o" id="ns">New game</button><button class="btn s o" id="rs">Resign</button></div>`;
$('#hi',b).onclick=()=>{if(over||g.game_over()||g.turn()!=me)return;const s=pick(me,2,false);hn=g.moves({verbose:true}).find(x=>x.san==s);toast('Best move: '+s);draw()};
$('#un',b).onclick=()=>{if(over||!g.history().length)return;g.undo();if(g.turn()!=me&&g.history().length)g.undo();sel=null;hn=null;draw();turn()};
$('#ns',b).onclick=setup;$('#rs',b).onclick=()=>{if(!over&&!g.game_over()){over='You resigned. Night Bot wins.';draw()}};
$$('[data-s]',b).forEach(x=>x.onclick=()=>{const s=x.dataset.s;if(over||g.game_over()||g.turn()!=me)return;hn=null;if(sel&&g.move({from:sel,to:s,promotion:'q'})){sel=null;draw();turn();return}const p=g.get(s);sel=p&&p.color==me?s:null;draw()})};setup()}
let gs={g:'dice',mode:'online'};
function panel(){const g=G[gs.g],gp=$('#gp');$$('.gc').forEach(c=>c.classList.toggle('on',c.dataset.g==gs.g));
if(g.tool||g.bo){gp.innerHTML=`<div class="card stage" id="st"></div>`;g.f($('#st'),'Night Bot');return}
gp.innerHTML=`<div class="seg" style="margin:6px 0"><button data-md="online" class="${gs.mode=='online'?'on':''}">PLAY ONLINE</button><button data-md="bot" class="${gs.mode=='bot'?'on':''}">PLAY VS BOT</button></div>${gs.mode=='bot'?'':`<div class="card g"><div><span class="pill" style="font-size:11px;color:#2dd4bf">FREE MATCH</span><h3 style="font-size:22px;margin:10px 0 4px">${g.n} Matchmaking</h3><p class="mu">Join the queue to be paired with another online player.</p></div><button class="btn" id="fm">Find match</button></div>
<div class="card g"><h3>Create private or public room</h3><div><label>Room name</label><input id="rn" value="Night Call room"></div><div class="row"><div style="flex:1"><label>Visibility</label><select id="rv"><option>Public</option><option>Private</option></select></div><div style="flex:1"><label>Players</label><select id="rp"><option>2</option><option>3</option><option>4</option><option>6</option></select></div></div><button class="btn o" id="cr">Create room</button><div id="lobby"></div></div>
<div class="card g"><h3>Join challenge room</h3><div class="row" style="flex-wrap:nowrap"><input id="jc" inputmode="numeric" maxlength="6" placeholder="Enter code (e.g. 543987)"><button class="btn s" id="jn">Join</button></div></div>`}<div class="card stage" id="st" ${gs.mode=='bot'?'':'hidden'}></div>`;
const st=$('#st'),run=o=>{st.hidden=0;g.f(st,o);st.scrollIntoView({behavior:'smooth',block:'center'})};
if(gs.mode=='bot')g.f(st,'Night Bot');
$$('[data-md]',gp).forEach(x=>x.onclick=()=>{gs.mode=x.dataset.md;panel()});
const fm=$('#fm');if(fm)fm.onclick=()=>{st.hidden=0;st.innerHTML='<p class="mu">Searching for an opponent…</p>';setTimeout(()=>run('Player'+(100+R(900))),1800)};
const cr=$('#cr');if(cr)cr.onclick=()=>{const n=+$('#rp').value,code=String(100000+R(900000)),lb=$('#lobby');let j=1;const t=setInterval(()=>{j++;paint();if(j>=n){clearInterval(t)}},1200),paint=()=>{lb.innerHTML=`<div class="card" style="background:none"><b>${$('#rn').value||'Room'}</b> <span class="pill" style="font-size:11px">${$('#rv').value}${$('#rv').value=='Private'?' · code '+code:''}</span><p class="mu" style="margin:8px 0">${j}/${n} players</p>${j>=n?'<button class="btn" id="go2">Start match</button>':''}</div>`;const s=$('#go2');if(s)s.onclick=()=>run('Player'+(100+R(900)))};paint()};
const jn=$('#jn');if(jn)jn.onclick=()=>{if(!/^\d{6}$/.test($('#jc').value)){toast('Enter a 6-digit room code');return}run('Room host')}}
/* router */
const NAV=[['home','home','Home'],['leaderboard','chart','Leaderboard'],['games','game','Games'],['more','menu','More']];
function render(){const[r,k]=(location.hash.slice(1)||'home').split('/'),v=V[r]?r:'home',app=$('#app');app.innerHTML=V[v](k);app.style.animation='none';void app.offsetWidth;app.style.animation='';
$('#bar').innerHTML=NAV.map(([id,i,l])=>`<button data-go="${id=='more'?'':id}" data-more="${id=='more'?1:''}" class="${(id==v||(id=='more'&&!['home','leaderboard','games'].includes(v)))?'on':''}">${ic(i)}${l}</button>`).join('');
$$('[data-t]').forEach(x=>x.onclick=()=>{lbT=x.dataset.t;render()});
if(v=='home'){paintStats();paintOwner()}if(v=='games'){$$('.gc').forEach(c=>c.onclick=()=>{gs={g:c.dataset.g,mode:'online'};panel()});panel()}
if(v=='theme'){$$('[data-m]').forEach(x=>x.onclick=()=>{document.documentElement.dataset.mode=x.dataset.m;ls.s('nc_m',x.dataset.m);render()});$$('[data-c]').forEach(x=>x.onclick=()=>{setC(x.dataset.c,1);render()});$('#cc').oninput=e=>{setC(e.target.value,1)};const lo=$('#lo');if(lo)lo.onclick=logout}
if(v=='apply'&&k){$('#sub').onclick=async()=>{const q=$$('[data-q]');if(q.some(x=>!x.value.trim())){toast('Please answer every question');return}if(!user){toast('Sign in with Discord first');return}try{const r=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:k,answers:q.map(x=>x.value.trim())})});if(!r.ok){const d=await r.json().catch(()=>({}));toast(d.error||'Could not submit');return}}catch(e){toast('Server unreachable');return}app.innerHTML=`<div class="card stage"><div style="font-size:48px">✅</div><h3 style="font-size:24px">Application submitted</h3><p class="mu">Thanks for applying to Night Call. The staff team will contact you on Discord.</p><button class="btn" style="margin-top:16px" data-go="home">Back home</button></div>`}}
window.scrollTo(0,0)}
function drawer(on){$('#dr').classList.toggle('on',on);if(on){const h=location.hash.slice(1)||'home';$('#side').innerHTML=[['home','home','Home'],['leaderboard','chart','Leaderboard'],['games','game','Games'],['apply','file','Apply'],['theme','pal','Theme'],['support','ticket','Support']].map(([id,i,l])=>`<button data-go="${id}" class="${h.startsWith(id)?'on':''}">${ic(i)}${l}</button>`).join('')+(user?`<button data-go="theme">${ic('user')}${user.name}</button>`:`<button id="sl">${ic('login')}Sign in with Discord</button>`);const s=$('#sl');if(s)s.onclick=()=>{drawer(0);login()}}}
document.addEventListener('click',e=>{const m=e.target.closest('[data-more]');if(m&&m.dataset.more){drawer(!$('#dr').classList.contains('on'));return}const g=e.target.closest('[data-go]');if(g){drawer(0);location.hash=g.dataset.go||'home';if(location.hash==='#'+g.dataset.go)render()}});
$('#sh').onclick=()=>drawer(0);
addEventListener('hashchange',render);
const sm=ls.g('nc_m'),sc=ls.g('nc_c');if(sm)document.documentElement.dataset.mode=sm;if(sc)setC(sc);
paintAuth();render();loadOwner();loadMe();loadLB();loadStats();setInterval(loadLB,60000);setInterval(()=>{const p=$('#pa');if(p)p.textContent=Math.max(2,+p.textContent+R(3)-1)},6000);

document.addEventListener('click',e=>{const um=$('#um'),sc=e.target.closest('[data-sc]');if(sc){$('#hs').scrollBy({left:+sc.dataset.sc*300,behavior:'smooth'});return}if(e.target.closest('#avb')&&user){um.innerHTML=`<b>${user.name}</b><small>@${user.username||user.name}</small><hr><button data-go="profile">${ic('gear')}Settings</button><button id="so" style="color:#f43f5e">${ic('out')}Sign Out</button>`;um.hidden=!um.hidden;const so=$('#so');if(so)so.onclick=logout;return}if(!e.target.closest('#um')||e.target.closest('#um [data-go]'))um.hidden=true},true);
</script></body></html>
